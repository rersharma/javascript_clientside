<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  </head>
  
  <body>

     <div class="containermt-3">
         <h2 class="text-center">Student Registration Form</h2>
         <div class="row">
              <div class="col-sm-4 offset-sm-3">
                   <form action="#" method="post" id="Registration-form">
                          <div class="mt-3">
                             <label for="name">Name</label>
                             <input type="text" id="name" name="name" class="form-control">
                             <span class="text-danger" id="nameerror"></span>
                          </div>

                          <div class="mt-3">
                             <label for="email">Email</label>
                             <input type="text" id="email" name="email" class="form-control">
                             <span class="text-danger" id="emailerror"></span>
                          </div>
                          <div class="mt-3">
                             <label for="mobile">Moble</label>
                             <input type="number" id="mobile" name="mobile" class="form-control">
                             <span class="text-danger" id="mobileerror"></span>
                          </div>

                        <div class="mt-3">
                                    <input type="submit" class="btn btn-primary" value="Register Now">
                        </div>

                   </form>
              </div>
         </div>
     </div>



     <script>
          const form=document.getElementById("Registration-form");
          form.addEventListener("submit",function(event){
               event.preventDefault();
               var isvalid=true;
               const name=document.getElementById("name").value.trim();
               const email=document.getElementById("email").value.trim();
               const mobile=document.getElementById("mobile").value.trim();

               const email_pattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
               const mobile_patter= /^[6-9]\d{9}$/;
               if(name=="")
               {
                  document.getElementById("nameerror").innerText="Please Enter your name";
                  isvalid=false;
               } 
               else if(email=="")
               {
                 document.getElementById("nameerror").innerText="";
                 document.getElementById("emailerror").innerText="Please Enter your Email-Id";
                 isvalid=false;
               }
               else if(!email_pattern.test(email))
               {
                  document.getElementById("emailerror").innerText="Please Enter valid Email-Id";
                 isvalid=false;
               }
                else if(mobile=="")
               {
                document.getElementById("nameerror").innerText="";
                document.getElementById("emailerror").innerText="";
                 document.getElementById("mobileerror").innerText="Please Enter Mobile Number";
                 isvalid=false;
               }
               else if(!mobile_patter.test(mobile))
               {
                      document.getElementById("mobileerror").innerText="Invalid Mobile Number";
                 isvalid=false;
               }
               return isvalid;
          });
  </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  </body>
</html>
